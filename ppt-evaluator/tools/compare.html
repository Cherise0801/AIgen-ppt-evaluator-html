<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT 测评校准 - 人工盲测</title>
<script src="/static/echarts.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --border: #e4e7ed;
    --text: #303133;
    --text-sub: #606266;
    --primary: #409eff;
    --success: #67c23a;
    --warning: #e6a23c;
    --danger: #f56c6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  .topbar {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar h1 { font-size: 16px; margin: 0; }
  .progress-info { display: flex; gap: 16px; align-items: center; color: var(--text-sub); }
  .progress-bar { width: 200px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--primary); transition: width 0.3s; }
  .main { padding: 16px 24px; }
  .warning-banner {
    background: #fdf6ec; border: 1px solid #faecd8; color: #b88230;
    padding: 10px 16px; border-radius: 6px; margin-bottom: 12px; display: none;
  }
  .warning-banner.show { display: block; }
  .warning-banner.error { background: #fef0f0; border-color: #fde2e2; color: #c45656; }
  .input-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 16px; margin-bottom: 12px;
  }
  .input-box label { color: var(--text-sub); font-size: 12px; }
  .input-box .content { margin-top: 4px; white-space: pre-wrap; }
  .compare-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 70vh;
  }
  .pane {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .pane-header {
    padding: 8px 12px; background: #fafbfc; border-bottom: 1px solid var(--border);
    font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  }
  .pane-header .variant { color: var(--primary); }
  .pane-header .format { color: var(--text-sub); font-size: 12px; font-weight: normal; }
  .pane iframe { width: 100%; flex: 1; border: none; background: white; }
  /* PPTX 缩略图网格 */
  .pane-body { flex: 1; overflow: auto; padding: 8px; background: #fafbfc; }
  .thumb-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }
  .thumb {
    background: white; border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; overflow: hidden; transition: all 0.15s; position: relative;
  }
  .thumb:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(64,158,255,0.15); }
  .thumb img { width: 100%; display: block; }
  .thumb iframe { width: 200%; height: 200%; border: none; transform: scale(0.5); transform-origin: 0 0; pointer-events: none; background: white; }
  .thumb-label {
    position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.6); color: white;
    padding: 2px 6px; border-radius: 3px; font-size: 11px;
  }
  .pane-error { padding: 24px; text-align: center; color: var(--danger); }
  .actions {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 16px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .confidence { display: flex; gap: 6px; align-items: center; }
  .confidence button {
    width: 36px; height: 36px; border: 1px solid var(--border); background: white;
    border-radius: 4px; cursor: pointer; font-weight: 600;
  }
  .confidence button:hover { background: #ecf5ff; }
  .confidence button.selected { background: var(--primary); color: white; border-color: var(--primary); }
  .btn-row { display: flex; gap: 8px; }
  .btn {
    padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 14px; font-weight: 500; transition: all 0.2s;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #66b1ff; }
  .btn-primary:disabled { background: #c0c4cc; cursor: not-allowed; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-sub); }
  .stats {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 16px; margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;
  }
  .stat-card { text-align: center; }
  .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
  .stat-card .label { color: var(--text-sub); font-size: 12px; margin-top: 4px; }
  .chart-box { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 12px; }
  .chart { width: 100%; height: 220px; }
  .toast {
    position: fixed; top: 80px; right: 24px; background: var(--success); color: white;
    padding: 10px 16px; border-radius: 4px; opacity: 0; transition: opacity 0.3s; z-index: 100;
  }
  .toast.show { opacity: 1; }
  .empty {
    text-align: center; padding: 60px 20px; color: var(--text-sub);
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  }
  .empty h2 { color: var(--text); }
  .kbd {
    display: inline-block; padding: 2px 6px; background: #f4f4f5; border: 1px solid #e4e7ed;
    border-radius: 3px; font-family: monospace; font-size: 12px;
  }
  .hint { color: var(--text-sub); font-size: 12px; }
  /* 灯箱 */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000;
    display: none; align-items: center; justify-content: center; flex-direction: column;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 85vh; box-shadow: 0 8px 32px rgba(0,0,0,0.5); background: white; }
  .lightbox-controls {
    color: white; padding: 12px; display: flex; gap: 16px; align-items: center;
    font-size: 14px;
  }
  .lightbox-controls button {
    background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px;
  }
  .lightbox-controls button:hover { background: rgba(255,255,255,0.25); }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px; color: white; font-size: 28px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div class="topbar">
  <h1>🎯 PPT 测评校准 - 人工盲测</h1>
  <div class="progress-info">
    <span>进度</span>
    <div class="progress-bar"><div id="progress-fill" style="width: 0%"></div></div>
    <span id="progress-text">0 / 0</span>
  </div>
</div>

<div class="main" id="app">
  <div id="warning-banner" class="warning-banner"></div>

  <div id="empty-state" class="empty" style="display: none;">
    <h2>没有可用的 case</h2>
    <p>请在 <code>cases/</code> 目录下创建子目录，每个子目录包含 <code>input.txt</code> + <code>a.{html|pptx}</code> + <code>b.{html|pptx}</code></p>
  </div>

  <div id="case-area" style="display: none;">
    <div class="input-box">
      <label>📝 输入（同一 prompt）</label>
      <div class="content" id="input-content"></div>
    </div>

    <div class="compare-grid">
      <div class="pane">
        <div class="pane-header">
          <span class="variant">方案 A</span>
          <span class="format" id="format-a"></span>
        </div>
        <div class="pane-body" id="pane-a"></div>
      </div>
      <div class="pane">
        <div class="pane-header">
          <span class="variant">方案 B</span>
          <span class="format" id="format-b"></span>
        </div>
        <div class="pane-body" id="pane-b"></div>
      </div>
    </div>

    <div class="actions">
      <div class="confidence">
        <span class="hint">信心度：</span>
        <button data-c="1">1</button>
        <button data-c="2">2</button>
        <button data-c="3">3</button>
        <button data-c="4">4</button>
        <button data-c="5">5</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-warning" id="btn-skip">⏭ 跳过</button>
        <button class="btn btn-primary" id="btn-choose-a" disabled>选 A (←)</button>
        <button class="btn btn-primary" id="btn-choose-b" disabled>选 B (→)</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="num" id="stat-completed">0</div>
        <div class="label">已完成</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-pending">0</div>
        <div class="label">待评估</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-a-ratio">-</div>
        <div class="label">A 胜出率</div>
      </div>
    </div>

    <div class="chart-box">
      <div id="chart-progress" class="chart"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast">已记录</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">×</button>
  <iframe id="lightbox-frame" style="display:none; width: 92vw; height: 85vh; border: none; background: white; box-shadow: 0 8px 32px rgba(0,0,0,0.5);"></iframe>
  <img id="lightbox-img" alt="放大查看" />
  <div class="lightbox-controls">
    <button id="lb-prev">← 上一页</button>
    <span id="lb-info">1 / 1</span>
    <button id="lb-next">下一页 →</button>
    <span class="hint" style="color: rgba(255,255,255,0.5); margin-left: 16px;">ESC 关闭</span>
  </div>
</div>

<script>
// ============== 状态 ==============
const state = {
  cases: [],
  pending: [],
  currentCase: null,
  currentVariants: { a: null, b: null },  // {type: 'html'|'pptx', payload: ...}
  selectedConfidence: null,
  results: { selections: [], metadata: {} },
  chart: null,
  // 灯箱
  lightbox: { open: false, variant: null, pages: [], currentIndex: 0 },
};

// ============== API 调用 ==============
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`API ${path} failed: ${res.status} - ${text.slice(0, 200)}`);
  }
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('application/json')) return res.json();
  return res.text();
}

async function checkHealth() {
  try {
    const data = await api('/api/health');
    const banner = document.getElementById('warning-banner');
    if (!data.ready) {
      const missing = [];
      if (!data.libreoffice.available) missing.push('LibreOffice');
      if (!data.pymupdf.available) missing.push('PyMuPDF');
      banner.textContent = `⚠️ 检测到 ${data.pptx_case_count} 个 PPTX case，但依赖缺失：${missing.join('、')}。HTML case 不受影响，PPTX 渲染将失败。` +
        '\n' + (data.libreoffice.message || '');
      banner.classList.add('show', 'error');
    } else if (data.pptx_case_count > 0) {
      banner.textContent = `ℹ️ 当前有 ${data.pptx_case_count} 个 PPTX case，已自动启用 LibreOffice 渲染。`;
      banner.classList.add('show');
      banner.classList.remove('error');
    } else {
      banner.classList.remove('show', 'error');
    }
  } catch (e) {
    console.warn('health check failed', e);
  }
}

async function loadCases() {
  const data = await api('/api/cases');
  state.cases = data.cases;
}

async function loadResults() {
  state.results = await api('/api/results');
  state.pending = state.results.pending_case_ids;
  updateStats();
  renderChart();
}

async function loadInput(caseId) {
  const data = await api(`/api/case/${caseId}/input`);
  document.getElementById('input-content').textContent = data.input || '（无输入）';
}

async function loadVariant(caseId, variant) {
  // HTML 走 text/html，PPTX 走 JSON
  // 用 Accept 头让 server 知道我们想要什么？不需要——server 自己判断文件类型
  const url = `/api/case/${caseId}/render/${variant}`;
  // 先尝试 fetch 看 content-type
  const res = await fetch(url);
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('application/json')) {
    const data = await res.json();
    if (data.error) {
      return { type: 'error', message: data.message || 'unknown' };
    }
    return { type: data.type, payload: data };
  } else {
    // HTML：把内容放到 src doc 里
    const html = await res.text();
    return { type: 'html', payload: html };
  }
}

// ============== 渲染 ==============
function updateStats() {
  const total = state.cases.length;
  const completed = state.results.completed_case_ids.length;
  const pending = state.pending.length;
  const aCount = state.results.selections.filter(s => s.chosen === 'A').length;
  const aRatio = completed > 0 ? Math.round((aCount / completed) * 100) + '%' : '-';

  document.getElementById('stat-completed').textContent = completed;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-a-ratio').textContent = aRatio;

  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${completed} / ${total}`;
}

function renderChart() {
  if (!state.chart) state.chart = echarts.init(document.getElementById('chart-progress'));
  const completed = state.results.completed_case_ids.length;
  const pending = state.pending.length;
  state.chart.setOption({
    title: { text: '盲测进度', left: 'left', textStyle: { fontSize: 14, fontWeight: 'normal' } },
    tooltip: { trigger: 'item' },
    legend: { bottom: 0, left: 'center' },
    series: [{
      type: 'pie', radius: ['50%', '70%'], avoidLabelOverlap: false,
      label: { show: true, formatter: '{b}: {c}' },
      data: [
        { value: completed, name: '已完成', itemStyle: { color: '#67c23a' } },
        { value: pending, name: '待评估', itemStyle: { color: '#e4e7ed' } },
      ]
    }]
  });
}

function showEmpty() {
  document.getElementById('empty-state').style.display = 'block';
  document.getElementById('case-area').style.display = 'none';
}

function renderVariant(variant) {
  // 渲染到 pane-body
  const data = state.currentVariants[variant];
  const pane = document.getElementById(`pane-${variant}`);
  const formatLabel = document.getElementById(`format-${variant}`);

  if (!data) {
    pane.innerHTML = '<div class="pane-error">未加载</div>';
    return;
  }

  if (data.type === 'html') {
    formatLabel.textContent = 'HTML 渲染';
    // 用 iframe
    pane.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'width:100%; height:100%; border:none; background:white;';
    // 用 srcdoc 注入 HTML（避免 src 跨域）
    iframe.srcdoc = data.payload;
    pane.style.padding = '0';
    pane.appendChild(iframe);
  } else if (data.type === 'pptx' || data.type === 'multi-html') {
    const labelText = data.type === 'pptx' ? `PPTX · ${data.payload.page_count} 页` : `HTML · ${data.payload.page_count} 页`;
    formatLabel.textContent = labelText;
    pane.style.padding = '8px';
    // 缩略图网格
    const grid = document.createElement('div');
    grid.className = 'thumb-grid';
    const useIframe = (data.type === 'multi-html');
    data.payload.pages.forEach((page, idx) => {
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const media = useIframe
        ? `<iframe src="${page.url}" title="第 ${page.page} 页" loading="lazy" sandbox="allow-same-origin"></iframe>`
        : `<img src="${page.url}" alt="第 ${page.page} 页" loading="lazy" />`;
      thumb.innerHTML = `
        <span class="thumb-label">第 ${page.page} 页</span>
        ${media}
      `;
      thumb.onclick = () => openLightbox(variant, idx);
      grid.appendChild(thumb);
    });
    pane.innerHTML = '';
    pane.appendChild(grid);
    // 提示文字
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.style.cssText = 'margin-top:8px; text-align:center;';
    hint.textContent = `共 ${data.payload.page_count} 页，点击缩略图放大查看`;
    pane.appendChild(hint);
  } else if (data.type === 'error') {
    formatLabel.textContent = '错误';
    pane.style.padding = '24px';
    pane.innerHTML = `<div class="pane-error">❌ ${data.message}</div>`;
  }
}

async function showCase() {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('case-area').style.display = 'block';
  // 找当前 case 的格式信息
  const caseMeta = state.cases.find(c => c.case_id === state.currentCase);
  await loadInput(state.currentCase);
  // 并发加载 A 和 B
  state.currentVariants.a = await loadVariant(state.currentCase, 'a');
  state.currentVariants.b = await loadVariant(state.currentCase, 'b');
  renderVariant('a');
  renderVariant('b');
  // 重置信心度
  state.selectedConfidence = null;
  document.querySelectorAll('.confidence button').forEach(b => b.classList.remove('selected'));
  document.getElementById('btn-choose-a').disabled = false;
  document.getElementById('btn-choose-b').disabled = false;
}

// ============== 灯箱 ==============
function openLightbox(variant, pageIdx) {
  const data = state.currentVariants[variant];
  if (!data || (data.type !== 'pptx' && data.type !== 'multi-html')) return;
  state.lightbox.open = true;
  state.lightbox.variant = variant;
  state.lightbox.variantType = data.type;
  state.lightbox.pages = data.payload.pages;
  state.lightbox.currentIndex = pageIdx;
  updateLightbox();
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox() {
  state.lightbox.open = false;
  document.getElementById('lightbox').classList.remove('show');
}

function lightboxPrev() {
  if (!state.lightbox.open) return;
  state.lightbox.currentIndex = (state.lightbox.currentIndex - 1 + state.lightbox.pages.length) % state.lightbox.pages.length;
  updateLightbox();
}

function lightboxNext() {
  if (!state.lightbox.open) return;
  state.lightbox.currentIndex = (state.lightbox.currentIndex + 1) % state.lightbox.pages.length;
  updateLightbox();
}

function updateLightbox() {
  const pages = state.lightbox.pages;
  const cur = state.lightbox.currentIndex;
  const url = pages[cur].url;
  const img = document.getElementById('lightbox-img');
  const frm = document.getElementById('lightbox-frame');
  if (state.lightbox.variantType === 'multi-html') {
    img.style.display = 'none';
    frm.style.display = 'block';
    frm.src = url;
  } else {
    frm.style.display = 'none';
    img.style.display = 'block';
    img.src = url;
  }
  document.getElementById('lb-info').textContent = `第 ${pages[cur].page} 页 / 共 ${pages.length} 页`;
}

document.getElementById('lightbox-close').onclick = closeLightbox;
document.getElementById('lb-prev').onclick = lightboxPrev;
document.getElementById('lb-next').onclick = lightboxNext;
document.getElementById('lightbox').onclick = (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
};

// ============== 交互 ==============
async function nextCase() {
  if (state.pending.length === 0) {
    state.currentCase = null;
    document.getElementById('case-area').style.display = 'none';
    document.getElementById('empty-state').innerHTML = `
      <h2>🎉 全部完成！</h2>
      <p>已完成 ${state.results.completed_case_ids.length} 个 case 的人工盲测</p>
      <p>下一步：用本 Skill 跑 AI 测评，然后执行 <code>python tools/analyze.py</code> 生成对比报告</p>
    `;
    document.getElementById('empty-state').style.display = 'block';
    return;
  }
  state.currentCase = state.pending[0];
  await showCase();
}

async function choose(variant) {
  if (!state.currentCase) return;
  await api('/api/select', {
    method: 'POST',
    body: JSON.stringify({
      case_id: state.currentCase,
      chosen: variant,
      confidence: state.selectedConfidence,
    })
  });
  showToast(`已选择方案 ${variant}`);
  await loadResults();
  await nextCase();
}

async function skip() {
  if (!state.currentCase) return;
  state.pending.push(state.pending.shift());
  if (state.pending.length > 0) {
    state.currentCase = state.pending[0];
    await showCase();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// 事件绑定
document.getElementById('btn-choose-a').onclick = () => choose('A');
document.getElementById('btn-choose-b').onclick = () => choose('B');
document.getElementById('btn-skip').onclick = skip;

document.querySelectorAll('.confidence button').forEach(btn => {
  btn.onclick = () => {
    state.selectedConfidence = parseInt(btn.dataset.c);
    document.querySelectorAll('.confidence button').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  };
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  // 灯箱打开时优先级
  if (state.lightbox.open) {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lightboxPrev();
    else if (e.key === 'ArrowRight') lightboxNext();
    return;
  }
  if (e.key === 'ArrowLeft') choose('A');
  else if (e.key === 'ArrowRight') choose('B');
  else if (e.key === ' ') { e.preventDefault(); skip(); }
});

// ============== 启动 ==============
(async () => {
  await checkHealth();
