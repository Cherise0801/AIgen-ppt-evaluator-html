<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style id="design-components" data-design-system="true">
/* ============================================================
   Common Styles — PPT 幻灯片 v3.0
   基础组件样式 | 值来自 design-tokens 变量，自动联动
   ============================================================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  font-family: var(--font-body);
  color: var(--on-bg);
  background-color: var(--bg-page, #f0f2f5);
  -webkit-font-smoothing: antialiased;
}


/* --- 画布 --- */

.slide {
  width: var(--canvas-width);
  height: var(--canvas-height);
  margin: 0 auto;
  background: var(--bg-page);
  position: relative;
  overflow: hidden;
  padding: var(--slide-padding);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-slide);
}
.slide > * { min-height: 0; }

body.auto-scale .slide { transform-origin: top left; }


/* --- 标题区 --- */

.slide-title-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  margin-bottom: var(--spacing-5);
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}
.slide-title-bar::before {
  content: none;
}
.slide-title {
  font-family: var(--font-heading);
  font-size: var(--text-h1);
  font-weight: 700;
  color: var(--on-bg);
  line-height: var(--line-height-tight);
  letter-spacing: var(--letter-spacing-tight);
}


/* --- 卡片 --- */

.card {
  position: relative;
  background: var(--bg-card);
  border: var(--border-width) solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--pad-card);
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-normal);
}
.card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--border-accent);
}
.card-title {
  font-size: var(--text-h2);
  font-weight: 600;
  line-height: var(--line-height-tight);
  color: var(--on-bg);
  letter-spacing: var(--letter-spacing-normal);
  margin-bottom: var(--gap-title);
}


/* --- 均等分容器 (核心布局) --- */

.card-grid-2 {
  display: grid;
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: var(--gap-item);
  flex: 1;
  min-height: 0;
}
.card-grid-3 {
  display: grid;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: var(--gap-item);
  flex: 1;
  min-height: 0;
}
.card-grid-4 {
  display: grid;
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: var(--gap-item);
  flex: 1;
  min-height: 0;
}


/* --- 按钮 --- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-2);
  padding: var(--spacing-2) var(--spacing-4);
  font-size: var(--text-caption);
  font-weight: 500;
  border-radius: var(--radius-md);
  border: var(--border-width) solid transparent;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover { opacity: 0.9; }
.btn-outline {
  background: transparent;
  color: var(--primary);
  border-color: var(--primary);
}
.btn-outline:hover { background: var(--primary-container); }


/* --- 标签 --- */

.tag {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  padding: var(--spacing-1) var(--spacing-3);
  font-size: var(--text-tag);
  font-weight: var(--font-weight-medium);
  border-radius: var(--radius-full);
  line-height: 1;
  white-space: nowrap;
}
.tag-primary {
  background: var(--primary-container);
  color: var(--on-primary-container);
  border: var(--border-width) solid var(--primary-container);
}
.tag-secondary {
  background: var(--secondary-container);
  color: var(--on-secondary-container);
  border: var(--border-width) solid var(--secondary-container);
}
.tag-tertiary {
  background: var(--tertiary-container);
  color: var(--on-tertiary-container);
  border: var(--border-width) solid var(--tertiary-container);
}
.tag-success {
  background: var(--success-container);
  color: var(--on-success-container);
  border: var(--border-width) solid var(--success-container);
}
.tag-warning {
  background: var(--warning-container);
  color: var(--on-warning-container);
  border: var(--border-width) solid var(--warning-container);
}
.tag-error {
  background: var(--error-container);
  color: var(--on-error-container);
  border: var(--border-width) solid var(--error-container);
}
.tag-neutral {
  background: var(--bg-elevated);
  color: var(--on-bg-variant);
  border: var(--border-width) solid var(--border);
}


/* --- 指标药丸标签 --- */

.measure-pill {
  display: flex; align-items: center; gap: var(--spacing-2);
  padding: var(--spacing-3) var(--spacing-4);
  background: var(--primary-container);
  border: none;
  border-radius: var(--radius-lg);
  font-size: var(--text-tag); font-weight: var(--font-weight-medium);
  color: var(--on-primary-container);
}
.measure-pill .m-icon {
  width: var(--measure-icon-size); height: var(--measure-icon-size);
  border-radius: var(--radius-full);
  background: var(--primary);
  color: var(--on-primary);
  display: flex; align-items: center; justify-content: center;
}
.measure-pill .m-icon svg { width: var(--measure-icon-svg); height: var(--measure-icon-svg); }


/* --- 图标容器 (SVG / Font Awesome) --- */

.icon-box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  /* overflow:visible 时 flex 默认 min-size 仍会按内容撑开，导致 emoji img 顶高头栏 */
  overflow: hidden;
  box-sizing: border-box;
  border-color: var(--border-light);
  color: var(--primary);
  background: var(--primary-container);
  border-radius: var(--radius-md);
  /* 裸 icon-box 默认 md；尺寸以 .icon-box.icon-box-* 为准，避免页面 CSS 覆盖裸 .icon-box 时丢尺寸 */
  width: var(--icon-box-md);
  height: var(--icon-box-md);
}
.icon-box svg { flex-shrink: 0; max-width: 100%; max-height: 100%; }
.icon-box i { flex-shrink: 0; line-height: 1; max-width: 100%; max-height: 100%; }
.icon-box .icon-emoji {
  flex-shrink: 0;
  line-height: 1;
  color: unset;
  user-select: none;
  max-width: 100%;
  max-height: 100%;
}
.icon-box img.icon-emoji {
  display: block;
  object-fit: contain;
  vertical-align: middle;
  /* 在 icon-box-sm/md 等、没有 inline 尺寸时也能把 SVG/img 钳在盒内 */
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
}

/* 复合选择器提高优先级，压过页面样式里对裸 .icon-box 的 width/height 覆盖 */
.icon-box.icon-box-sm {
  width: var(--icon-box-sm); height: var(--icon-box-sm);
  background: var(--primary-container);
}
.icon-box.icon-box-sm svg { width: var(--icon-svg-sm); height: var(--icon-svg-sm); }
.icon-box.icon-box-sm i { font-size: var(--icon-svg-sm); }
.icon-box.icon-box-sm .icon-emoji { font-size: var(--icon-svg-sm); }
.icon-box.icon-box-sm img.icon-emoji { width: var(--icon-svg-sm); height: var(--icon-svg-sm); }

.icon-box.icon-box-md {
  width: var(--icon-box-md); height: var(--icon-box-md);
  background: var(--primary-container);
}
.icon-box.icon-box-md svg { width: var(--icon-svg-md); height: var(--icon-svg-md); }
.icon-box.icon-box-md i { font-size: var(--icon-svg-md); }
.icon-box.icon-box-md .icon-emoji { font-size: var(--icon-svg-md); }
.icon-box.icon-box-md img.icon-emoji { width: var(--icon-svg-md); height: var(--icon-svg-md); }

.icon-box.icon-box-lg {
  width: var(--icon-box-lg); height: var(--icon-box-lg);
  background: var(--primary-container);
}
.icon-box.icon-box-lg svg { width: var(--icon-svg-lg); height: var(--icon-svg-lg); }
.icon-box.icon-box-lg i { font-size: var(--icon-svg-lg); }
.icon-box.icon-box-lg .icon-emoji { font-size: var(--icon-svg-lg); }
.icon-box.icon-box-lg img.icon-emoji { width: var(--icon-svg-lg); height: var(--icon-svg-lg); }

.icon-box.icon-box-xl {
  width: var(--icon-box-xl); height: var(--icon-box-xl);
  background: var(--primary-container);
}
.icon-box.icon-box-xl svg { width: var(--icon-svg-xl); height: var(--icon-svg-xl); }
.icon-box.icon-box-xl i { font-size: var(--icon-svg-xl); }
.icon-box.icon-box-xl .icon-emoji { font-size: var(--icon-svg-xl); }
.icon-box.icon-box-xl img.icon-emoji { width: var(--icon-svg-xl); height: var(--icon-svg-xl); }

/* 无尺寸 class 时 Twemoji img 也不要吃满父级 / SVG 固有大尺寸 */
img.icon-emoji {
  display: inline-block;
  vertical-align: middle;
  width: var(--icon-svg-md);
  height: var(--icon-svg-md);
  object-fit: contain;
  flex-shrink: 0;
}

img.emoji-inline {
  display: inline-block;
  vertical-align: -0.125em;
  height: 1em;
  width: 1em;
  object-fit: contain;
  flex-shrink: 0;
}

.icon-size { color: var(--primary); }

.icon-box-primary {
  background: var(--primary-container);
  color: var(--primary);
}

.icon-box-primary-solid {
  background: var(--primary-container);
  color: var(--primary);
}


/* --- 序号容器 (Number Box) --- */

.number-box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border-radius: var(--radius-md);
  background: var(--primary-container);
}

.number-size {
  color: var(--primary);
}

.number-box-sm {
  width: var(--number-box-sm); height: var(--number-box-sm);
  background: var(--primary-container);
}
.number-box-sm .number-size, .number-box-sm .number-size-sm {
  font-size: var(--number-size-sm);
  font-weight: var(--font-weight-bold);
  line-height: 1;
  color: var(--primary);
}

.number-box-md {
  width: var(--number-box-md); height: var(--number-box-md);
  background: var(--primary-container);
}
.number-box-md .number-size, .number-box-md .number-size-md {
  font-size: var(--number-size-md);
  font-weight: var(--font-weight-bold);
  line-height: 1;
  color: var(--primary);
}

.number-box-lg {
  width: var(--number-box-lg); height: var(--number-box-lg);
  background: var(--primary-container);
}
.number-box-lg .number-size, .number-box-lg .number-size-lg {
  font-size: var(--number-size-lg);
  font-weight: var(--font-weight-bold);
  line-height: 1;
  color: var(--primary);
}

.number-box-xl {
  width: var(--number-box-xl); height: var(--number-box-xl);
  background: var(--primary-container);
}
.number-box-xl .number-size, .number-box-xl .number-size-xl {
  font-size: var(--number-size-xl);
  font-weight: var(--font-weight-bold);
  line-height: 1;
  color: var(--primary);
}

.number-box-primary {
  background: var(--primary-container);
  color: var(--on-primary-container);
}

.number-box-primary-solid {
  background: var(--primary);
  color: var(--on-primary);
}


/* --- 勾选列表 --- */

.check-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--gap-item);
}
.check-list li {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-2);
  font-size: var(--text-caption);
  color: var(--on-bg-variant);
  line-height: var(--line-height-relaxed);
}
.check-icon {
  flex-shrink: 0;
  width: var(--check-icon-size); height: var(--check-icon-size);
  border-radius: var(--radius-full);
  background: var(--primary-container);
  color: var(--on-primary-container);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 4px;
}
.check-icon svg { width: var(--check-icon-svg); height: var(--check-icon-svg); stroke: currentColor; }


/* --- 阶段编号水印 --- */

.phase-number {
  position: absolute;
  font-size: var(--phase-number-size);
  font-weight: var(--font-weight-bold);
  color: var(--primary);
  opacity: var(--phase-number-opacity);
  line-height: 1;
  user-select: none;
  pointer-events: none;
  letter-spacing: var(--letter-spacing-watermark);
}


/* --- 分节标签 --- */

.section-overline {
  font-size: var(--text-tag);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--letter-spacing-wide);
  text-transform: uppercase;
  color: var(--on-bg-muted);
}


/* --- 分隔线 --- */

.divider {
  border: none;
  border-top: var(--border-width) solid var(--divider);
  margin: var(--spacing-4) 0;
  flex-shrink: 0;
}

/* --- 内容区模式 --- */

.content-area {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-4);
  position: relative;
  z-index: 1;
}

.content-area--center {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-4);
  justify-content: center;
}


/* --- 优先级标签（P0/P1/P2） --- */

.priority-tag {
  display: inline-flex;
  align-items: center;
  padding: var(--spacing-1) var(--spacing-3);
  font-size: var(--text-tag);
  font-weight: var(--font-weight-semibold);
  border-radius: var(--radius-full);
  line-height: 1.2;
  white-space: nowrap;
}
.tag-p0, .tag-required {
  background: var(--error-container);
  color: var(--error);
}
.tag-p1, .tag-high {
  background: var(--warning-container);
  color: var(--warning);
}
.tag-p2, .tag-optional {
  background: var(--bg-elevated);
  color: var(--on-bg-muted);
}


/* --- 金句英雄区 — 结束页 + content 页引言 --- */

.quote-hero {
  background: var(--accent-block-bg);
  color: var(--accent-block-fg);
  padding: var(--spacing-5) var(--spacing-6);
  border-radius: var(--radius-md);
}
.quote-hero .quote-text {
  color: inherit;
  font-size: var(--text-h2);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-relaxed);
}


/* --- 底部引言条 --- */

.quote-bar {
  margin-top: auto;
  padding: var(--spacing-3) var(--spacing-4);
  border-top: 1px solid var(--divider);
  font-size: var(--text-tag);
  color: var(--on-bg-variant);
}


/* --- 卡片居中布局（内容稀疏时：图标+短标题+短描述） --- */

.card-vc {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: var(--spacing-4);
}


/* ============================================================
   表格样式 — 4 种可选样式 class（tbl-bordered / tbl-threeline /
   tbl-clean / tbl-stripe）
   ============================================================ */

/* --- 共享基础 --- */

.tbl-bordered,
.tbl-threeline,
.tbl-clean,
.tbl-stripe,
.tbl-matrix,
.tbl-grade {
  width: 100%;
  border-spacing: 0;
  border-collapse: collapse;
  font-size: var(--text-body);
  color: var(--on-bg);
}

.tbl-bordered th,
.tbl-bordered td,
.tbl-threeline th,
.tbl-threeline td,
.tbl-clean th,
.tbl-clean td,
.tbl-stripe th,
.tbl-stripe td,
.tbl-matrix th,
.tbl-matrix td,
.tbl-grade th,
.tbl-grade td {
  padding: 8px 12px;
  text-align: left;
  vertical-align: middle;
  line-height: var(--line-height-normal);
}

.tbl-bordered th,
.tbl-threeline th,
.tbl-clean th,
.tbl-stripe th,
.tbl-matrix th,
.tbl-grade th {
  font-weight: var(--font-weight-semibold);
}


/* --- 样式一：全框型 --- */

.tbl-bordered {
  border: var(--border-width) solid var(--border);
}
.tbl-bordered th,
.tbl-bordered td {
  border: var(--border-width) solid var(--border);
}
.tbl-bordered thead {
  background: var(--primary) !important;
}
.tbl-bordered thead tr {
  background: transparent !important;
}
.tbl-bordered thead th {
  background: transparent !important;
  color: var(--on-primary) !important;
  border: var(--border-width) solid var(--border);
  border-bottom: var(--border-width) solid var(--border);
  font-size: var(--text-h3) !important;
  font-weight: var(--font-weight-semibold) !important;
}
.tbl-bordered tbody tr {
  background: var(--bg-card) !important;
}
.tbl-bordered tbody td {
  color: var(--on-bg) !important;
  font-size: var(--text-body) !important;
}


/* --- 样式二：三线型 --- */

.tbl-threeline {
  border-top: var(--border-width-thick) solid var(--divider-strong);
  border-bottom: var(--border-width-thick) solid var(--divider-strong);
}
.tbl-threeline th,
.tbl-threeline td {
  border: none !important;
}
.tbl-threeline thead tr {
  background: transparent !important;
}
.tbl-threeline thead th {
  background: var(--primary-container) !important;
  color: var(--on-bg) !important;
  border-bottom: var(--border-width) solid var(--divider-strong) !important;
  font-size: var(--text-h3) !important;
  font-weight: var(--font-weight-semibold) !important;
}
.tbl-threeline tbody tr {
  background: var(--bg-card) !important;
}
.tbl-threeline tbody td {
  color: var(--on-bg) !important;
  font-size: var(--text-body) !important;
}


/* --- 样式三：无框留白型 --- */

.tbl-clean th,
.tbl-clean td {
  border: none !important;
  padding: 12px 16px;
}
.tbl-clean thead tr {
  background: transparent !important;
  border-top: var(--border-width) solid var(--border) !important;
  border-bottom: var(--border-width) solid var(--divider) !important;
}
.tbl-clean thead th {
  background: var(--primary-container) !important;
  color: var(--on-bg) !important;
  font-weight: var(--font-weight-bold) !important;
  font-size: var(--text-h3) !important;
}
.tbl-clean tbody tr {
  background: var(--bg-card) !important;
}
.tbl-clean tbody td {
  color: var(--on-bg) !important;
  font-size: var(--text-body) !important;
}
.tbl-clean tbody tr:last-child {
  border-bottom: var(--border-width) solid var(--border) !important;
}


/* --- 样式四：块面分割型（默认样式） --- */

.tbl-stripe th,
.tbl-stripe td {
  border: none !important;
}
.tbl-stripe thead tr {
  background: transparent !important;
}
.tbl-stripe thead th {
  background: var(--accent-block-bg) !important;
  color: var(--accent-block-fg) !important;
  font-size: var(--text-h3) !important;
  font-weight: var(--font-weight-semibold) !important;
}
.tbl-stripe tbody tr:nth-child(odd) {
  background: var(--bg-card) !important;
}
.tbl-stripe tbody tr:nth-child(even) {
  background: var(--bg-elevated) !important;
}
.tbl-stripe tbody td {
  color: var(--on-bg) !important;
  font-size: var(--text-body) !important;
}


/* --- C14 热力图对比表 --- */

.c-heatmap {
  display: flex;
  width: 100%;
  height: 100%;
  flex: 1;
  min-height: 0;
  min-width: 0;
  flex-direction: column;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: var(--pad-card);
  box-shadow: var(--shadow-card);
}
.c-heatmap .card-title {
  font-size: var(--text-body);
  font-weight: var(--font-weight-semibold);
  color: var(--on-bg);
  margin-bottom: var(--spacing-4);
  flex-shrink: 0;
}
.c-heatmap .heatmap-wrap {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
}
.c-heatmap .heatmap-table {
  width: 100%;
  height: 100%;
  border-collapse: separate;
  border-spacing: 2px;
  table-layout: fixed;
}
.c-heatmap .heatmap-table th {
  background: var(--bg-elevated);
  font-size: var(--text-tag);
  font-weight: var(--font-weight-semibold);
  color: var(--on-bg-variant);
  padding: var(--spacing-2) var(--spacing-2);
  text-align: center;
  border-radius: var(--radius-md);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.c-heatmap .heatmap-table .row-head {
  background: var(--bg-elevated);
  font-size: var(--text-tag);
  font-weight: var(--font-weight-medium);
  color: var(--on-bg-variant);
  text-align: left;
  padding: var(--spacing-2) var(--spacing-3);
  border-radius: var(--radius-md);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.c-heatmap .heatmap-table .cell {
  font-size: var(--text-caption);
  font-weight: var(--font-weight-semibold);
  text-align: center;
  padding: var(--spacing-2) var(--spacing-2);
  border-radius: var(--radius-md);
  word-break: break-all;
}
